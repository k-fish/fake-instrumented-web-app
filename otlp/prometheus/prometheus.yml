global:
  scrape_interval: 15s
  evaluation_interval: 15s

# The OTLP receiver is enabled with --web.enable-otlp-receiver and listens on
# POST /api/v1/otlp/v1/metrics. Resource attributes listed here become labels.
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - deployment.environment

storage:
  tsdb:
    # OTLP exporters batch and can arrive slightly out of order.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
